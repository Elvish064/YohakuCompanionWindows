[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yohaku-companion-windows"
version = "1.7.12"
description = "Privacy-first Yohaku Live Desk companion for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.11.1,<6.12",
    "qasync>=0.28,<0.29",
    "httpx>=0.28,<0.29",
    "keyring>=25.7,<26",
    "regex>=2024.11.6,<2027",
    "pywin32==312; sys_platform == 'win32'",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Control==3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pyinstaller>=6.12,<7",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "pytest-qt>=4.4,<5",
    "ruff>=0.11,<1",
]

[project.scripts]
yohaku-companion-windows = "yohaku_companion_windows.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yohaku_companion_windows = ["assets/*.svg"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
